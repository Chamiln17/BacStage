# Bac 3AS Filter Configuration
# =============================
# This file contains tunable parameters for the data-driven filtering system.
# Adjust these values based on validation results to balance precision vs recall.

# Channel prior thresholds
# Used to determine which channels are "Bac-heavy" based on their content
channel_prior:
  bac_threshold: 0.5 # p_bac >= 0.6 to mark Bac-heavy (70% of grade-marked videos are Bac)
  non_bac_max: 0.1 # p_non <= 0.1 to mark Bac-heavy (max 10% non-Bac content)

# Soft positive rules (OR logic by default)
# For ambiguous videos in Bac-heavy channels, require at least one soft positive
soft_positives:
  duration_min: 60 # seconds (2 minutes) - filters out short clips/teasers
  require_tfidf: true # if true, TF-IDF hit is mandatory for ambiguous videos
  require_duration: true # if true, duration gate is mandatory for ambiguous videos
  allow_channel_subject: true # use channels.csv subject as a soft positive

# TF-IDF discovery parameters
# Controls how automatic keyword discovery works
tfidf:
  top_n_terms: 100 # Number of top discriminative terms to keep
  min_df: 3 # Minimum document frequency (ignore rare terms)
  max_df: 0.8 # Maximum document frequency (ignore very common terms)
  ngram_range: [1, 2] # Unigrams + bigrams
  analyzer: "char_wb" # Character n-grams with word boundaries (good for Arabic)

# Grade markers (minimal set, expand only when validated)
# These are the core markers for Bac vs non-Bac detection
markers:
  # Positive markers: indicate Bac / 3AS content
  bac:
    - bac
    - 3as
    - بكالوريا
    - باك
    - ثالثة ثانوي
    - السنة الثالثة ثانوي
    - terminale
    # Added from false negative analysis (high-signal phrases)
    - 3 ثانوي
    - السنة 3 ثانوي
    - جميع الشعب
    - شعب علمية
    - شعب أدبية
    # Curriculum-based markers (3AS-only topics from official منهاج)
    # Math topics (highest priority - fixes errors from مرنيز وليد, عبد الباسط)
    - الأعداد المركبة
    - التكامل
    - الدوال الأصلية
    - النهايات
    - الدالة الأسية
    - الدالة اللوغاريتمية
    - التحويلات النقطية
    - المتتاليات العددية
    - الهندسة في الفضاء
    # Biology topics (fixes errors from شاوش)
    - الاتصال العصبي
    - المناعة
    - التركيب الضوئي
    - التحولات الطاقوية
    # Physics topics
    - التحولات النووية
    - ثنائي القطب RC
    - ثنائي القطب RL
    - التطورات المهتزة
    # History topics
    - القطبية الثنائية

  # Negative markers: indicate non-Bac content (1AS, 2AS, middle school, primary)
  non_bac:
    - 1as
    - 2as
    # Add these variations:
    - 1 ثانوي # "1 secondary"
    - 2 ثانوي # "2 secondary"
    - الاولى ثانوي # "the first secondary"
    - الثانية ثانوي # "the second secondary"
    - للسنة 1 ثانوي # "for year 1 secondary"
    - للسنة 2 ثانوي # "for year 2 secondary"
    - لسنة 1 ثانوي # "for year 1 secondary"
    - لسنة 2 ثانوي # "for year 2 secondary"
    - السنة 1 ثانوي # "year 1 secondary"
    - السنة 2 ثانوي # "year 2 secondary"
    # Keep existing:
    - سنة أولى ثانوي
    - سنة ثانية ثانوي
    - أولى ثانوي
    - ثانية ثانوي
    - متوسط
    - bem
    - 1am
    - 2am
    - 3am
    - 4am
    - ابتدائي

  # Strong Bac intent phrases: override non-Bac markers in conflict cases
  strong_bac_intent:
    - مراجعة بكالوريا
    - تحضير بكالوريا
    - تصحيح بكالوريا
    - موضوع بكالوريا
    - حل موضوع بكالوريا
    - bac blanc
    - révision bac
    - corrigé bac
    - sujet bac

# Output paths (relative to project root)
paths:
  input: data/raw/videos_metadata.csv
  channels: data/raw/channels.csv
  output_dir: data/processed
  validation_dir: data/validation

# Validation sampling configuration
validation:
  sample_bac_3as: 100 # Sample size for precision check
  sample_bac_ambiguous: 100 # Sample size for soft positive check
  sample_non_bac: 50 # Sample size for false negative check
  sample_conflict: 50 # Sample size for conflict override check
