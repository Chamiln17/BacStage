[project]
name = "sic"
version = "0.1.0"
description = "Algerian Bac Educational Video Engagement Analysis"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "SIC Team" }
]

dependencies = [
    "pandas>=2.0.0",
    "google-api-python-client>=2.100.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "scikit-learn>=1.3.0",
    "xgboost>=3.1.3",
    "lightgbm>=4.6.0",
    "ipykernel>=7.1.0",
    "transformers>=4.40.0,<4.50.0",
    "torch==2.5.1", # Pinned to match cu121 index
    "textstat>=0.7.12",
    "pysocks>=1.7.1",
    "yt-dlp>=2025.12.8",
    "stem>=1.8.2",
    "statsmodels>=0.14.6",
    "optuna>=4.7.0",
    "catboost>=1.2.8",
]

# PyTorch CUDA index for GPU support
[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.7.0",
    "ruff>=0.0.285",
    "mypy>=1.5.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 88
target-version = ["py310", "py311"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --cov=src --cov-report=term-missing"

[dependency-groups]
dev = [
    "pandas-stubs>=2.3.3.260113",
    "types-tqdm>=4.67.0.20250809",
]
